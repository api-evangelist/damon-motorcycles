name: Damon Motorcycles
description: >-
  Damon Motorcycles (Damon Inc.) is a Vancouver, British Columbia electric
  motorcycle company founded in 2017 by Jay Giraud and Dominique Kwong, and an
  alumnus of the Techstars accelerator. Damon builds high-performance electric
  motorcycles led by the HyperSport and HyperFighter models, and is known for two
  safety and ergonomics technologies: CoPilot, a 360-degree advanced warning
  system that uses radar, cameras, and sensors to alert riders to surrounding
  hazards, and Shift, a transformable ergonomics system that adjusts the riding
  position between commuter and sport stances. The company has faced significant
  financial and going-concern difficulties, and its public web presence at
  damon.com currently returns errors, so no developer portal, documentation, or
  public API surface could be verified during enrichment. This profile is
  maintained as a company record in the API Evangelist network.
